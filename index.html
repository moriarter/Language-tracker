<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Language Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h2>Language Exposure T-2Tracker</h2>

<div id="debug" style="color:red; margin-bottom:10px;"></div>

<!-- Authentication -->
<div id="auth">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="signupBtn">Sign Up</button>
  <button id="loginBtn">Login</button>
</div>

<hr>

<!-- App Dashboard -->
<div id="app" style="display:none;">
  <h3>Add Session</h3>

  <input type="text" id="language" placeholder="Language (e.g. English)">
  
  <select id="skill">
    <option>Listening</option>
    <option>Speaking</option>
    <option>Reading</option>
    <option>Writing</option>
    <option>Repeating Words</option>
  </select>

  <input type="number" id="minutes" placeholder="Minutes">
  <input type="date" id="date">
  
  <button id="addBtn">Add</button>

  <h3>Total Minutes: <span id="total">0</span></h3>
</div>

<script>
  // 🔑 Replace with your Supabase keys
  const supabase = window.supabase.createClient(
    "https://gzmydyfegoryivnhqgph.supabase.co",
    "sb_publishable_Iw0T07QnZHxvk_7_EoVMvA_e0hkVCJy"
   {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
   }
  );

  // Debug function
  function debug(msg) {
    document.getElementById('debug').innerText = msg;
  }

  // --- Auth Functions ---
  async function signUp() {
    debug("SignUp clicked");
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signUp({ email, password });
    if (error) debug("Signup error: " + error.message);
    else debug("Check your email to confirm signup.");
  }

  async function signIn() {
    debug("Login clicked");
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password,
    });

    if (error) {
      debug("Login error: " + error.message);
      return;
    }

    debug("Login success!");
    document.getElementById('auth').style.display = "none";
    document.getElementById('app').style.display = "block";

    loadTotal();
  }

  async function addSession() {
  // Check logged in user
  const { data: userData, error: userError } = await supabase.auth.getUser();

  if (userError) {
    document.getElementById("debug").innerText =
      "Auth error: " + userError.message;
    return;
  }

  const user = userData.user;

  if (!user) {
    document.getElementById("debug").innerText =
      "NOT LOGGED IN";
    return;
  }

  document.getElementById("debug").innerText =
    "Logged in as: " + user.id;

  // Get form values
  const language = document.getElementById("language").value;
  const skill = document.getElementById("skill").value;
  const minutes = parseInt(document.getElementById("minutes").value);
  const date = document.getElementById("date").value;

  if (!language || !skill || !minutes || !date) {
    document.getElementById("debug").innerText =
      "Please fill all fields";
    return;
  }

  // Insert into database
  const { error } = await supabase
    .from("sessions")
    .insert([
      {
        user_id: user.id,
        language: language,
        skill: skill,
        minutes: minutes,
        session_date: date,
      },
    ]);

  if (error) {
    document.getElementById("debug").innerText =
      "Insert error: " + error.message;
    return;
  }

  document.getElementById("debug").innerText =
    "Session added successfully!";

  loadTotal();
}

  async function loadTotal() {
    const { data: userData } = await supabase.auth.getUser();
    const user = userData.user;
    if (!user) return;

    const { data, error } = await supabase
      .from('sessions')
      .select('minutes')
      .eq('user_id', user.id);

    if (error) {
      debug("Load error: " + error.message);
      return;
    }

    const total = data.reduce((sum, row) => sum + row.minutes, 0);
    document.getElementById('total').innerText = total;
  }

    async function checkUser() {
  const { data } = await supabase.auth.getUser();

  if (data.user) {
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("debug").innerText =
      "Already logged in: " + data.user.email;
  }
}

checkUser();

  // --- Attach button events AFTER page loads ---
  document.getElementById('signupBtn').onclick = signUp;
  document.getElementById('loginBtn').onclick = signIn;
  document.getElementById('addBtn').onclick = addSession;

</script>

</body>
</html>
